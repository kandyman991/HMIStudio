name: Tag engine CI
on:
  push:
    branches: [main]
    paths:
      - 'crates/tag-engine/**'
      - 'crates/project-model/**'
      - '.github/workflows/tag-engine.yml'
  pull_request:
    paths:
      - 'crates/tag-engine/**'
      - 'crates/project-model/**'
      - '.github/workflows/tag-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tag-engine-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: crates/tag-engine
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/tag-engine
          key: tag-engine-dedicated
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - run: git diff --exit-code -- Cargo.lock
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Audit locked dependencies (RustSec)
        run: cargo audit --deny warnings
