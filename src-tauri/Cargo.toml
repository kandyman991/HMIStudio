[package]
name = "hmi-studio"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
hmi-engineering-core = { path = "../crates/engineering-core" }
hmi-project-model = { path = "../crates/project-model" }
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_json = "1"
