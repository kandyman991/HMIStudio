name: Desktop CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true
jobs:
  changes:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      native: ${{ steps.plan.outputs.native }}
      package: ${{ steps.plan.outputs.package }}
      crates: ${{ steps.plan.outputs.crates }}
      crate_dirs: ${{ steps.plan.outputs.crate_dirs }}
      crate_os: ${{ steps.plan.outputs.crate_os }}
      targeted: ${{ steps.plan.outputs.targeted }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test change routing
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v
      - name: Select applicable checks
        id: plan
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_REF: ${{ github.ref }}
          CI_ACTION: ${{ github.event.action }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_DRAFT: ${{ github.event.pull_request.draft }}
          CI_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CI_HEAD_REF: ${{ github.head_ref }}
          CI_BASE_REF: ${{ github.base_ref }}
          CI03_TOKEN: ${{ github.token }}
        run: python3 .github/ci/plan.py
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- package-lock.json
  crates:
    needs: changes
    if: needs.changes.outputs.crates == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.crate_os) }}
        crate: ${{ fromJSON(needs.changes.outputs.crate_dirs) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.crate == 'crates/hmi-engine' && 45 || 25 }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.crate }}
          key: ${{ matrix.crate }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
      - run: cargo fmt --check
      - if: matrix.crate != 'crates/hmi-engine'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: matrix.crate != 'crates/hmi-engine'
        run: cargo test --locked
      - name: rustdoc
        if: matrix.crate != 'crates/hmi-engine'
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
      - name: Engine clippy (all test-server targets)
        if: matrix.crate == 'crates/hmi-engine'
        run: cargo clippy --all-targets --locked --features test-server -- -D warnings
      - name: Engine tests (including OPC UA and S7)
        if: matrix.crate == 'crates/hmi-engine'
        run: cargo test --locked --features test-server -- --test-threads=1
      - name: Engine rustdoc
        if: matrix.crate == 'crates/hmi-engine'
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked --features test-server
      - name: Engine dependency notice inventory
        if: matrix.crate == 'crates/hmi-engine' && runner.os == 'Linux'
        run: python3 ../../.github/ci/check_engine_notices.py
      - name: Engine advisory gate (no ignored advisories)
        if: matrix.crate == 'crates/hmi-engine' && runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --file Cargo.lock
      - name: Legacy import advisory gate (no ignored advisories)
        if: matrix.crate == 'crates/legacy-import' && runner.os == 'Linux' && needs.changes.outputs.targeted == 'false'
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --file Cargo.lock
          cargo audit --file ../engineering-core/Cargo.lock
          cargo audit --file ../../src-tauri/Cargo.lock
      - if: matrix.crate == 'crates/project-model'
        run: cargo run --locked --example validate -- fixtures/valid/minimal.hmi.json fixtures/valid/bottling-line.hmi.json
      - run: git diff --exit-code -- Cargo.lock
  desktop:
    needs: [changes, frontend]
    if: needs.changes.outputs.native == 'true' && needs.frontend.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            crates/hmi-engine
          key: native-${{ needs.changes.outputs.package }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-bin: 'false'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run tauri -- icon assets/icon.svg
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Native project simulation with real isolated child
        shell: pwsh
        run: |
          cargo build --locked --manifest-path crates/hmi-engine/Cargo.toml --bin hmi-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = if ($IsWindows) { 'hmi-engine.exe' } else { 'hmi-engine' }
          $env:HMI_ENGINE_TEST_BIN = (Resolve-Path "crates/hmi-engine/target/debug/$name").Path
          cargo test --locked --manifest-path src-tauri/Cargo.toml native_project_simulation -- --ignored
      # Owner-directed deferral for the REUSE-03B review draft. Ready-for-review
      # and every other PR, release and manual build retain normal packaging.
      - name: Build installer when required
        if: needs.changes.outputs.package == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.number == 36 && github.event.pull_request.draft)
        run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.package == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.number == 36 && github.event.pull_request.draft)
        with:
          name: hmi-studio-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*.${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 3
  required:
    name: Required CI
    needs: [changes, frontend, crates, desktop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce applicable checks
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CRATES: ${{ needs.crates.result }}
          DESKTOP: ${{ needs.desktop.result }}
          WANT_FRONTEND: ${{ needs.changes.outputs.frontend }}
          WANT_CRATES: ${{ needs.changes.outputs.crates }}
          WANT_NATIVE: ${{ needs.changes.outputs.native }}
          WANT_PACKAGE: ${{ needs.changes.outputs.package }}
          TARGETED: ${{ needs.changes.outputs.targeted }}
          CRATE_DIRS: ${{ needs.changes.outputs.crate_dirs }}
          CRATE_OS: ${{ needs.changes.outputs.crate_os }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          check() {
            case "$1:$2" in
              true:success|false:skipped) ;;
              *) echo "Required CI mismatch: $3 ($1/$2)"; exit 1 ;;
            esac
          }
          check "$WANT_FRONTEND" "$FRONTEND" frontend
          check "$WANT_CRATES" "$CRATES" crates
          check "$WANT_NATIVE" "$DESKTOP" desktop
          case "$WANT_PACKAGE:$WANT_NATIVE" in true:true|false:true|false:false) ;; *) exit 1 ;; esac
          case "$TARGETED" in
            true)
              test "$WANT_FRONTEND:$WANT_NATIVE:$WANT_PACKAGE:$WANT_CRATES" = false:false:false:true
              test "$CRATE_DIRS" = '["crates/legacy-import"]'
              test "$CRATE_OS" = '["ubuntu-24.04"]'
              echo "CI-03 targeted draft checks only; not full milestone validation."
              ;;
            false) echo "CI-02 applicable checks passed." ;;
            *) exit 1 ;;
          esac
          echo "Intentionally skipped jobs are not test passes."
