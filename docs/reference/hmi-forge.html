function loadSaved() {
  try {
    const stored = JSON.parse(localStorage.getItem(storageKey));
    return isProject(stored) ? stored : null;
  } catch {
    return null;
  }
}

function isProject(project) {
  const validId = id => typeof id === 'string' && /^[\w-]+$/.test(id) && !Object.hasOwn(Object.prototype,id);
  const unique = records => new Set(records.map(record => record.id)).size === records.length;
  const strings = (...items) => items.every(value => typeof value === 'string');
  return project?.schema === sample.schema && typeof project.name === 'string' &&
    Array.isArray(project.pages) && project.pages.length > 0 && project.pages.every(page =>
      validId(page?.id) && strings(page.name,page.layout) && Array.isArray(page.widgets) &&
      page.widgets.every(widget => validId(widget?.id) && Object.hasOwn(kinds,widget.kind) &&
        strings(widget.name,widget.label,widget.tag) && [widget.x,widget.y,widget.w,widget.h].every(Number.isFinite) &&
        widget.x >= 0 && widget.y >= 0 && widget.w >= 16 && widget.h >= 16 &&
        widget.x + widget.w <= width && widget.y + widget.h <= height &&
        typeof widget.visible === 'boolean' && typeof widget.locked === 'boolean') && unique(page.widgets)) &&
    unique(project.pages) && Array.isArray(project.tags) && project.tags.every(item =>
      validId(item?.id) && strings(item.address,item.unit,item.description) &&
      typeof item.writable === 'boolean' &&
      (item.type === 'BOOL' ? typeof item.initial === 'boolean' : item.type === 'REAL' && Number.isFinite(item.initial))) &&
    unique(project.tags) && Array.isArray(project.alarms) && project.alarms.every(item =>
      validId(item?.id) && strings(item.tag,item.message) && ['Critical','Warning'].includes(item.priority) &&
      ['below','above'].includes(item.comparison) && Number.isFinite(item.limit) &&
      project.tags.some(record => record.id === item.tag && record.type === 'REAL')) && unique(project.alarms);
}

function addLog(message, level = 'Info') {
  state.log.unshift({time:stamp(),message,level});
  state.log.length = Math.min(state.log.length,100);

function resetRuntime() {
  state.tick = 0;
  state.overrides.clear();
  state.values = new Map(project().tags.map(item => [item.id,item.initial]));
  state.history.clear();
  state.activeAlarms.clear();
  project().tags.filter(item => item.type === 'REAL').forEach(item => {
    const seed = Array.from({length:24}, (_,i) => item.initial * (1 + Math.sin(i * .68) * .04 + (i - 23) * .0018));
    seed[seed.length - 1] = item.initial;
    state.history.set(item.id,seed);
  });
  updateAlarms(false);
}

function updateAlarms(logChanges = true) {
  for (const alarm of project().alarms) {
    const val = tagValue(alarm.tag);
    const active = alarm.comparison === 'below' ? val < alarm.limit : val > alarm.limit;
    if (active && !state.activeAlarms.has(alarm.id)) {
      state.activeAlarms.set(alarm.id,{time:stamp(),ack:false});
      if (logChanges) addLog(`${alarm.id} · ${alarm.message}`,alarm.priority);
    } else if (!active && state.activeAlarms.delete(alarm.id) && logChanges) {
      addLog(`${alarm.id} returned to normal`);
    }
  }
}

  if (!state[from].length) return;

  Object.assign(state,state[from].pop());
  state.openTabs = state.openTabs.filter(id => project().pages.some(item => item.id === id));
  if (!state.openTabs.includes(page().id)) state.openTabs.push(page().id);

function refreshBoard(board, activePage, isPreview = false) {
  board.classList.toggle('running',state.running);
  const mode = board.querySelector('[data-hmi-mode]');
  if (!mode) return;
  mode.innerHTML = `<span class="dot"></span> ${state.running ? 'SIM ACTIVE' : isPreview ? 'PREVIEW' : 'AUTO MODE'}`;
  board.querySelector('[data-hmi-time]').textContent = stamp();
  for (const node of board.querySelectorAll('[data-flow]')) {
    node.classList.toggle('idle',!tagValue(node.dataset.flow));
  }
  for (const node of board.querySelectorAll('[data-metric]')) {
    const key = node.dataset.metric;
    const value = tagValue(key);
    if (key === 'alarms') {
      node.textContent = `${state.activeAlarms.size} ACTIVE`;
      node.className = `metric-value ${state.activeAlarms.size ? 'amber' : 'accent'}`;
    } else if (key === 'P101_RUN') {
      node.textContent = value == null ? '—' : value ? 'RUNNING' : 'STOPPED';
      node.className = `metric-value ${value ? 'accent' : ''}`;
    } else {
      node.textContent = `${formatNumber(value)} ${getTag(key)?.unit || ''}`;
    }
  }
  for (const node of board.querySelectorAll('.widget')) {
    const widget = activePage.widgets.find(item => item.id === node.dataset.widget);
    if (!widget) continue;
    const record = getTag(widget.tag);
    const value = tagValue(widget.tag);
    node.querySelector('.pump')?.classList.toggle('stopped',!value);
    for (const live of node.querySelectorAll('[data-live]')) {
      switch (live.dataset.live) {
        case 'level': live.style.height = `${clamp(Number(value) || 0,0,100)}%`; break;
        case 'value': live.innerHTML = `${escape(displayValue(record,value))} <em>${escape(record?.unit || '')}</em>`; break;
        case 'lamp': live.className = `dot ${value ? 'accent' : 'muted'}`; break;
        case 'run':
          live.textContent = record ? widget.kind === 'valve' ? (value ? 'OPEN' : 'CLOSED') : (value ? 'RUNNING' : 'STOPPED') : 'UNBOUND';
          live.style.color = value ? 'var(--mint)' : '';
          break;
      }
    }
    const chart = node.querySelector('canvas');
    if (chart) drawTrend(chart,state.history.get(widget.tag) || []);
  }
  const alarms = board.querySelector('[data-board-alarms]');
  if (alarms) {
    const markup = alarmTable(isPreview,'active');
    if (alarmBoardMarkup.get(alarms) !== markup) {
      alarms.innerHTML = markup;
      alarmBoardMarkup.set(alarms,markup);
    }
  }
}

function drawTrend(canvas, points) {
  const context = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  context.clearRect(0,0,w,h);
  context.strokeStyle = '#436073';
  context.lineWidth = 1;
  context.beginPath();
  for (let i = 1; i < 5; i++) {
    const y = Math.round(i*h/5)+.5;
    context.moveTo(0,y);
    context.lineTo(w,y);
  }
  context.stroke();
  if (points.length < 2) return;
  const min = Math.min(...points), max = Math.max(...points);
  const range = Math.max(max-min,Math.abs(max)*.03,1);
  context.beginPath();
  points.forEach((value,index) => {
    const x = 4 + index*(w-8)/(points.length-1);
    const y = h*.84 - (value-min)/range*h*.67;
    if (index === 0) context.moveTo(x,y); else context.lineTo(x,y);
  });
  context.strokeStyle = '#65e2c2';
  context.lineWidth = 2.5;
  context.stroke();
}

let canvasScale = 1;
function fitCanvas() {
  const field = $('canvasField');
  const w = field.clientWidth, h = field.clientHeight;
  const margin = w < 500 || h < 330 ? 27 : 50;
  canvasScale = state.zoom ?? clamp(Math.min((w-margin)/width,(h-margin)/height),.12,1.25);
  const left = Math.round((w-width*canvasScale)/2 + state.panX);
  const top = Math.round((h-height*canvasScale)/2 + state.panY);
  Object.assign($('artboardFrame').style,{left:`${left}px`,top:`${top}px`,transform:`scale(${canvasScale})`});
  const caption = $('canvasCaption');
  caption.textContent = `${page().id.toUpperCase()}  /  860 × 480`;
  Object.assign(caption.style,{left:`${Math.max(5,left)}px`,top:`${Math.max(2,top-18)}px`});
  $('zoomReadout').textContent = `${Math.round(canvasScale*100)}%`;
  const ticks = (offset, side, max) => Array.from({length:Math.floor(max/100)+1},(_,i) => {
    const start = offset + i*100*canvasScale;
    return start >= 0 ? `<span style="${side}:${start+2}px">${i*100}</span>` : '';
  }).join('');
  setHtml('rulerX',ticks(left,'left',width));
  setHtml('rulerY',ticks(top,'top',height));
}

  const layers = [...page().widgets].reverse().map(widget => `<div class="layerline"><button class="tree-row${state.selection === widget.id ? ' active' : ''}${widget.locked ? ' locked' : ''}" data-action="widget:${widget.id}">${icon(iconName(widget))}<span class="truncate">${escape(widget.name)}</span>${widget.locked ? icon('lock') : ''}</button>${button(`visibility:${widget.id}`,widget.visible ? 'eye' : 'eye-off',`${widget.visible ? 'Hide' : 'Show'} ${widget.name}`)}</div>`).join('');
  setHtml('leftBody',`<section class="dock-group">${groupTitle('PAGES',button('new-page','plus','New page'))}
    <button class="tree-row" data-action="tree" aria-expanded="${state.treeOpen}">${icon(state.treeOpen ? 'down' : 'chevron')}${icon('folder')}<span class="truncate">${escape(project().name)}</span><span class="mini">${project().pages.length}</span></button>${state.treeOpen ? rows : ''}</section>
    <section class="dock-group">${groupTitle('LAYERS',`<span class="number-count">${page().widgets.length}</span>`)}${layers || '<div class="empty">No editable components</div>'}</section>${palette}`);
}

function renderTabs() {
  setHtml('editorTabs',state.openTabs.map(id => {
    const item = project().pages.find(entry => entry.id === id);
    if (!item) return '';
    return `<div class="tab-shell${id === state.pageId ? ' active' : ''}"><button class="tab" data-action="page:${id}" aria-current="${id === state.pageId}">${icon('page')} ${escape(item.name)}</button>${button(`close-page:${id}`,'close',`Close ${item.name} tab`,'iconbtn close-tab')}</div>`;
  }).join('') + button('new-page','plus','New page','iconbtn tab-add') +
    '<span class="editor-head">SCREEN EDITOR</span>');
}

function inputRow(label,key,value,kind = 'text',attributes = '') {
  return `<label class="prop-row"><span>${label}</span><input type="${kind}" data-field="${key}" value="${escape(value)}" ${attributes}></label>`;
}
function checkboxRow(label,key,checked) {
  return `<label class="prop-row"><span>${label}</span><input type="checkbox" data-field="${key}" ${checked ? 'checked' : ''}></label>`;
}
function requiredType(kind) {
  if (['pump','valve','lamp','button'].includes(kind)) return 'BOOL';
  if (['tank','sensor','trend'].includes(kind)) return 'REAL';
  return null;
}
function bindingIssue(widget) {
  const type = requiredType(widget.kind);
  const record = getTag(widget.tag);
  if (!type) return '';
  if (!record) return widget.tag ? `Tag ${widget.tag} is missing.` : `Select a ${type} tag.`;
  if (record.type !== type) return `This component requires a ${type} tag.`;
  if (widget.kind === 'button' && !record.writable) return 'This command requires a writable tag.';
  return '';
}

function renderInspector() {
  const tabs = {properties:'Properties',bindings:'Bindings',events:'Events'};
  setHtml('inspectorTabs',Object.entries(tabs).map(([key,name]) =>
    `<button class="${key === state.inspector ? 'on' : ''}" data-action="inspect-${key}" aria-pressed="${key === state.inspector}">${name}</button>`).join(''));
  const widget = selected();
  if (!widget) {
    setHtml('inspectorBody',`<div class="inspect-card">${icon('page')}<div class="truncate"><div class="inspect-name truncate">${escape(page().name)}</div><div class="inspect-type">Screen · 860 × 480 px</div></div></div>
      <div class="prop-section">${groupTitle('SCREEN')}${inputRow('Name','page-name',page().name,'text','maxlength="45"')}</div>
      <p class="empty">Select a component on the canvas or in Layers to edit it.</p>`);
    return;
  }
  const card = `<div class="inspect-card">${icon(iconName(widget))}<div class="truncate"><div class="inspect-name truncate">${escape(widget.name)}</div><div class="inspect-type">${kinds[widget.kind][0]} · ${escape(widget.id)}</div></div></div>`;
  let content;
  if (state.inspector === 'bindings') {
    const type = requiredType(widget.kind);
    const issue = bindingIssue(widget);
    const record = getTag(widget.tag);
    const choices = project().tags.filter(item => !type || type === item.type);
    const orphan = widget.tag && !choices.some(item => item.id === widget.tag);
    content = `<div class="prop-section">${groupTitle('PLC TAG BINDING')}<label class="field binding-note" for="bindingSelect">Value source</label>
      <select id="bindingSelect" data-field="widget-tag" style="width:100%"><option value="">Unbound</option>
      ${orphan ? `<option value="${escape(widget.tag)}" selected>${escape(widget.tag)} (unavailable)</option>` : ''}
      ${choices.map(item => `<option value="${item.id}" ${item.id === widget.tag ? 'selected' : ''}>${item.id} · ${item.type}</option>`).join('')}</select>
      ${issue ? `<p class="binding-note amber">${escape(issue)}</p>` : ''}
      ${record ? `<div class="prop-row"><span>Address</span><span class="mono">${escape(record.address)}</span></div>
      <div class="prop-row"><span>Live value</span><span class="mono accent" id="bindingLive"></span></div>
      <div class="prop-row"><span>Access</span><span>${record.writable ? 'Read / write' : 'Read-only'}</span></div>
      <div class="inspector-actions">${button('find-binding','search','Find references','action')}</div>` : ''}</div>`;
  } else if (state.inspector === 'events') {
    const command = ['pump','valve','button'].includes(widget.kind);
    content = `<div class="prop-section">${groupTitle('RUNTIME EVENTS')}
      <div class="prop-row"><span>Activation</span><span>${command ? 'Toggle bound BOOL' : 'Display only'}</span></div>
      <div class="prop-row"><span>Execution</span><span>Local simulator</span></div>
      <div class="inspector-actions">${button('preview','play','Open preview','action')}</div></div>`;
  } else {
    const locked = widget.locked ? 'disabled' : '';
    content = `<div class="prop-section">${groupTitle('IDENTITY')}
      ${inputRow('Name','widget-name',widget.name,'text','maxlength="45"')}${inputRow('Label','widget-label',widget.label,'text','maxlength="55"')}</div>
      <div class="prop-section">${groupTitle('TRANSFORM')}
      <div class="prop-pair">${inputRow('X','widget-x',naturalSize(widget,'x'),'number',`min="0" max="${width-widget.w}" ${locked}`)}${inputRow('Y','widget-y',naturalSize(widget,'y'),'number',`min="0" max="${height-widget.h}" ${locked}`)}</div>
      <div class="prop-pair">${inputRow('W','widget-w',naturalSize(widget,'w'),'number',`min="16" max="${width-widget.x}" ${locked}`)}${inputRow('H','widget-h',naturalSize(widget,'h'),'number',`min="16" max="${height-widget.y}" ${locked}`)}</div></div>
      <div class="prop-section">${groupTitle('DATA')}
      <button class="binding-preview" data-action="inspect-bindings">${icon('link')}<span class="mono truncate">${escape(widget.tag || 'Set binding')}</span><span class="spacer"></span>${icon('chevron')}</button></div>
      <div class="prop-section">${groupTitle('LAYER')}${checkboxRow('Visible','widget-visible',widget.visible)}${checkboxRow('Locked','widget-locked',widget.locked)}</div>`;
  }
  setHtml('inspectorBody',card + content);
  updateBindingValue();
}

function updateBindingValue() {
  const live = $('bindingLive');
  if (!live) return;
  const item = getTag(selected()?.tag);
  if (item) live.textContent = `${displayValue(item,tagValue(item.id))} ${item.unit}`.trim();
}

function table(headers, rows, empty = 'No matching items.') {
  return `<table class="data-table"><thead><tr>${headers.map(label => `<th scope="col">${label}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.join('') : `<tr><td colspan="${headers.length}" class="muted">${escape(empty)}</td></tr>`}</tbody></table>`;
}

function alarmTable(inPreview = false, filter = state.alarmFilter) {
  const rows = project().alarms.filter(item => filter === 'all' || state.activeAlarms.has(item.id)).map(item => {
    const active = state.activeAlarms.get(item.id);
    const status = active ? (active.ack ? 'Acknowledged' : 'Active') : 'Normal';
    const unit = getTag(item.tag)?.unit || '';
    return `<tr><td class="mono">${item.id}</td><td><span class="chip ${item.priority === 'Critical' ? 'bad' : 'warn'}">${item.priority}</span></td><td>${escape(item.message)}</td><td class="mono">${escape(item.tag)} ${item.comparison === 'below' ? '&lt;' : '&gt;'} ${item.limit} ${escape(unit)}</td><td>${status}</td><td class="mono">${active?.time || '—'}</td><td>${active && !active.ack ? button(`ack:${item.id}`,'check','Acknowledge','tool write-tag') : '—'}</td></tr>`;
  });
  return table(['Alarm','Priority','Message','Condition','State','Raised','Action'],rows,inPreview ? 'No active alarms.' : 'No alarms in this view.');
}

function renderOutput() {
  setHtml('outputTabs',Object.entries(outputViews).map(([key,[glyph,label]]) =>
    `<button class="tab${state.output === key ? ' on' : ''}" data-action="out-${key}" aria-pressed="${state.output === key}">${icon(glyph)} ${label}${key === 'alarms' ? ' <span class="number-count" id="alarmCount"></span>' : ''}</button>`).join('') +
    '<span class="spacer"></span>' + button('toggle-output','minus','Collapse engineering dock'));
  const filter = (name, placeholder, value = state.filter) =>
    `<input id="outputFilter" data-field="output-filter" type="search" placeholder="${placeholder}" aria-label="${name}" value="${escape(value)}">`;
  const options = (choices,active) => choices.map(([key,name]) => `<option value="${key}" ${key === active ? 'selected' : ''}>${name}</option>`).join('');
  const scope = '<span class="spacer"></span>';
  let tools;
  switch (state.output) {
    case 'tags':
      tools = `${icon('search')}${filter('Filter PLC tags','Filter tags or addresses…')}${scope}<small class="muted"><span class="mono">PLC-01</span> · Virtual S7</small>${button('reset-simulation','undo','Reset values','tool')}`;
      break;
    case 'search':
      tools = `${icon('search')}${filter('Search the project','Search names, addresses, or bindings…')}<select data-field="search-scope" aria-label="Search scope">${options(['All items','Pages','Components','Tags','Alarms'].map(value => [value,value]),state.searchScope)}</select>${scope}<small id="resultsCount" class="muted"></small>`;
      break;
    case 'alarms':
      tools = `${icon('bell')}<select data-field="alarm-filter" aria-label="Filter alarms">${options([['active','Active alarms'],['all','All alarm rules']],state.alarmFilter)}</select>${scope}${button('alarm-test','bolt','Inject test alarm','tool')}`;
      break;
    default:
      tools = `${icon('terminal')}<small class="muted">Local engineering activity</small>${scope}${button('clear-log','close','Clear log','tool')}`;
  }
  setHtml('outputTools',tools);
  renderOutputData();
}

function searchItems() {
  const items = [];
  for (const p of project().pages) {
    items.push(['Pages',p.name,'Screen',p.id,`page:${p.id}`]);
    for (const widget of p.widgets) {
      items.push(['Components',widget.name,p.name,widget.tag,`reference:${p.id}:${widget.id}`]);
    }
  }
  for (const item of project().tags) items.push(['Tags',item.id,item.description,item.address,`tag-ref:${item.id}`]);
  for (const item of project().alarms) items.push(['Alarms',item.id,item.message,item.tag,`alarm-ref:${item.id}`]);
  const query = state.filter.trim().toLowerCase();
  return items.filter(([type,...fields]) => (state.searchScope === 'All items' || state.searchScope === type) &&
    query.split(/\s+/).every(word => fields.slice(0,3).join(' ').toLowerCase().includes(word)));
}

function renderOutputData() {
  $('alarmCount').textContent = state.activeAlarms.size;
  if (state.output === 'tags') {
    const query = state.filter.trim().toLowerCase();
    const rows = project().tags.filter(item => `${item.id} ${item.address} ${item.description}`.toLowerCase().includes(query)).map(item => {
      const forced = state.overrides.has(item.id);
      const value = tagValue(item.id);
      return `<tr><td>${icon('tag')} <button class="table-btn mono" data-action="search-tag:${item.id}">${item.id}</button></td><td class="mono">${escape(item.address)}</td><td class="mono muted">${item.type}</td><td class="mono ${value === false ? 'muted' : 'accent'}" data-tag-value="${item.id}">${displayValue(item,value)} ${escape(item.unit)}</td><td><span class="chip ${forced ? 'warn' : 'good'}">${forced ? 'Forced' : 'Simulated'}</span></td><td>${escape(item.description)}</td><td>${item.writable ? button(`write:${item.id}`,'edit',`Write ${item.id}`,'iconbtn write-tag') : '<span class="muted">Read-only</span>'}</td></tr>`;
    });
    setHtml('outputData',table(['Tag','PLC address','Type','Value','Quality','Description','Write'],rows));
  } else if (state.output === 'search') {
    const result = searchItems();
    $('resultsCount').textContent = `${result.length} ${result.length === 1 ? 'result' : 'results'}`;
    setHtml('outputData',table(['Kind','Match','Location / description','Reference'],result.map(([type,name,location,ref,action]) =>
      `<tr><td>${escape(type)}</td><td><button class="table-btn" data-action="${action}">${escape(name)}</button></td><td>${escape(location)}</td><td class="mono muted">${escape(ref || '—')}</td></tr>`)));
  } else if (state.output === 'alarms') {
    setHtml('outputData',alarmTable());
  } else {
    setHtml('outputData',table(['Time','Level','Message'],state.log.map(item =>
      `<tr><td class="mono">${item.time}</td><td><span class="chip ${item.level === 'Critical' ? 'bad' : item.level === 'Warning' ? 'warn' : ''}">${item.level}</span></td><td>${escape(item.message)}</td></tr>`),'The event log is empty.'));
  }
}

function renderAll() {
  renderDocks();
  renderChrome();
  renderTabs();
  renderLeft();
  renderInspector();
  renderCanvas();
  renderOutput();
}

let toastTimer;
function toast(message) {
  $('toast').textContent = message;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; },3600);
}

function showModal(title, body, actions = '', kind = '') {
  const modal = $('modal');
  modal.dataset.kind = kind;
  modal.innerHTML = `<div class="dialog-head"><h2 id="dialogTitle">${title}</h2>${button('close-modal','close','Close dialog')}</div><div class="dialog-body">${body}</div>
    <div class="dialog-foot">${actions || button('close-modal',null,'Close','action')}</div>`;
  if (!modal.open) modal.showModal();
  modal.querySelector('[autofocus]')?.focus();
}

const cancelButton = () => button('close-modal',null,'Cancel','action');
const primary = (action,glyph,label) => button(action,glyph,label,'action primary');

function openNewPage() {
  showModal('New screen',`<form id="pageForm"><label class="field">Screen name<input id="newPageName" maxlength="45" required autofocus placeholder="e.g. Filter Gallery"></label>
    <label class="field">Template<select id="pageTemplate"><option value="blank">Blank screen</option><option value="trends">Trends layout</option><option value="alarms">Alarm annunciator</option></select></label></form>`,
    cancelButton() + primary('create-page','plus','Create screen'),'new-page');
}

function createPage() {
  if (!$('pageForm').reportValidity()) return;
  const name = $('newPageName').value.trim();
  if (!name) return toast('Enter a screen name.');
  const layout = $('pageTemplate').value;
  const id = uid('screen');
  const template = sample.pages.find(item => item.layout === layout);
  const widgets = layout === 'trends' ? structuredClone(template.widgets).map(widget => ({...widget,id:uid(widget.kind)})) : [];
  transact(() => {
    project().pages.push({id,name,layout,widgets});
    state.pageId = id;
    state.openTabs.push(id);
    state.selection = null;
    state.panX = state.panY = 0;
    state.mobileLeft = false;
  });
  $('modal').close();
  toast(`Created ${name}.`);
}

function changeProject(replacement, label) {
  state.project = replacement;
  state.pageId = replacement.pages[0].id;
  state.openTabs = replacement.pages.slice(0,3).map(item => item.id);
  state.selection = replacement.pages[0].widgets.find(widget => widget.id === 'pump101')?.id || null;
  state.undo = [];
  state.redo = [];
  state.running = false;
  state.log = [];
  state.filter = '';
  state.saved = JSON.stringify(replacement);
  state.saveLabel = label;
  state.panX = state.panY = 0;
  state.zoom = null;
  resetRuntime();
  addLog(`Opened ${replacement.name} in the browser prototype.`);
  renderAll();
}

function requestProjectChange(action) {
  if (!isDirty()) {
    if (action === 'open-file') $('importFile').click();
    else changeProject(structuredClone(sample),'Demo project');
    return;
  }
  showModal('Replace current project?', '<p>The current project has unsaved edits. Save it locally or export a copy before replacing it.</p>',
    cancelButton() + button('save', 'save', 'Save locally', 'action') + primary(`confirm-${action}`,null,'Continue'));
}

function save() {
  try {
    localStorage.setItem(storageKey,JSON.stringify(project()));
    state.saved = JSON.stringify(project());
    state.saveLabel = 'Saved locally';
    addLog('Project saved in this browser.');
    renderChrome();
    if (state.output === 'log') renderOutputData();
    toast('Saved in this browser.');
  } catch {
    toast('Browser storage is unavailable. Use File → Export project JSON.');
  }
}

function downloadJson(filename, object) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(object,null,2)+'\n'],{type:'application/json'}));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = filename;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url),1500);
}

function insertWidget(kind) {
  const [label,,w,h,defaultTag] = kinds[kind];
  const offset = (page().widgets.length % 6) * 16;
  const bound = getTag(defaultTag) || project().tags.find(item => item.type === requiredType(kind));
  const widget = makeWidget(uid(kind),kind,label,label,240+offset,160+offset,w,h,bound?.id || '');
  transact(() => {
    page().widgets.push(widget);
    state.selection = widget.id;
    state.mobileLeft = false;
    state.inspector = 'properties';
  });
  toast(`Inserted ${label}.`);
}

function removeWidget() {
  const widget = selected();
  if (!widget) return toast('Select a component first.');
  if (widget.locked) return toast('Unlock the layer before deleting it.');
  transact(() => {
    page().widgets = page().widgets.filter(item => item.id !== widget.id);
    state.selection = null;
  });
  toast(`Deleted ${widget.name}.`);
}

function pasteWidget(source = state.clipboard) {
  if (!source) return toast('Copy a component first.');
  const copy = {...source,id:uid(source.kind),name:`${source.name} copy`,locked:false,
    x:clamp(source.x+16,0,width-source.w),y:clamp(source.y+16,0,height-source.h)};
  transact(() => {
    page().widgets.push(copy);
    state.selection = copy.id;
  });
}

function setWidgetField(field, input) {
  const widget = selected();
  if (!widget) return;
  if (field === 'visible' || field === 'locked') {
    transact(() => { widget[field] = input.checked; });
    return;
  }
  const limits = {x:[0,width-widget.w],y:[0,height-widget.h],w:[16,width-widget.x],h:[16,height-widget.y]};
  if (limits[field]) {
    if (widget.locked || !Number.isFinite(input.valueAsNumber)) {
      input.value = widget[field];
      return;
    }
    const next = clamp(Math.round(input.valueAsNumber),...limits[field]);
    if (next !== widget[field]) transact(() => { widget[field] = next; });
    else input.value = next;
    return;
  }
  const text = input.value.trim();
  if (field === 'name' && !text) {
    input.value = widget.name;
    return;
  }
  if (widget[field] !== text) transact(() => { widget[field] = text; });
}

function setOutput(view, filter = '') {
  state.outputOpen = true;
  if (state.output !== view || filter) state.filter = filter;
  state.output = view;
  renderDocks();
  renderOutput();
}

function openInspector(tab) {
  state.inspector = tab;
  state.rightOpen = true;
  state.mobileRight = true;
  state.mobileLeft = false;
  renderDocks();
  renderInspector();
}

function recordPoint(id, value) {
  if (!Number.isFinite(value)) return;
  const history = state.history.get(id) || [];
  history.push(value);
  if (history.length > 48) history.shift();
  state.history.set(id,history);
}

function writeTag(id,value) {
  const record = getTag(id);
  if (!record?.writable) return toast('This tag is read-only or unavailable.');
  state.values.set(id,value);
  state.overrides.add(id);
  recordPoint(id,value);
  addLog(`Forced ${id} to ${value} locally.`);
  updateAlarms();
  refreshRuntime(true);
}

function openTagWriter(id) {
  const item = getTag(id);
  if (!item?.writable) return;
  const value = tagValue(id);
  const field = item.type === 'BOOL'
    ? `<select id="writeValue" autofocus><option value="true" ${value ? 'selected' : ''}>True</option><option value="false" ${!value ? 'selected' : ''}>False</option></select>`
    : `<input id="writeValue" type="number" step="any" value="${value}" required autofocus>`;
  showModal('Write simulated tag',`<p class="mono">${item.id} · ${escape(item.address)}</p><form id="writeForm"><label class="field">Value ${item.unit ? `(${escape(item.unit)})` : ''}${field}</label></form>
    <p class="notice">A forced value overrides the simulation until you reset the values.</p>`,
    cancelButton() + primary(`apply-tag:${id}`,'edit','Force value'),'write');
}

function applyWrite(id) {
  if (!$('writeForm').reportValidity()) return;
  const input = $('writeValue');
  const item = getTag(id);
  const value = item.type === 'BOOL' ? input.value === 'true' : input.valueAsNumber;
  if (item.type === 'REAL' && !Number.isFinite(value)) return;
  $('modal').close();
  writeTag(id,value);
  toast(`${id} set to ${value}.`);
}

function simulationStep() {
  if (!state.running) return;
  const t = ++state.tick;
  const pump = state.values.has('P101_RUN') ? tagValue('P101_RUN') : true;
  const valve = state.values.has('XV101_OPEN') ? tagValue('XV101_OPEN') : true;
  const movement = new Map([
    ['TK101_LEVEL',72.4 + Math.sin(t/13)*7],
    ['FT101_FLOW',(pump && valve ? 128.6 : 0) + (pump && valve ? Math.sin(t/3)*11 : 0)],
    ['PT101_PRESS',pump ? 3.2 + Math.cos(t/4)*.24 : .4],
    ['TK201_LEVEL',43.8 + Math.sin(t/15)*6],
    ['FT201_FLOW',pump && valve ? 116.4 + Math.sin(t/3.4)*9 : 0]
  ]);
  const alarmCount = state.activeAlarms.size;
  for (const item of project().tags) {
    if (item.type !== 'REAL') continue;
    if (!state.overrides.has(item.id)) state.values.set(item.id,movement.get(item.id) ?? item.initial);
    recordPoint(item.id,tagValue(item.id));
  }
  updateAlarms();
  refreshRuntime(alarmCount !== state.activeAlarms.size);
}

function refreshRuntime(full = false) {
  refreshBoard($('artboard'),page());
  updateBindingValue();
  if (full && state.output !== 'search') renderOutputData();
  else if (state.output === 'tags') {
    for (const cell of $('outputData').querySelectorAll('[data-tag-value]')) {
      const record = getTag(cell.dataset.tagValue);
      const value = tagValue(record.id);
      cell.textContent = `${displayValue(record,value)} ${record.unit}`;
      cell.classList.toggle('muted',value === false);
      cell.classList.toggle('accent',value !== false);
    }
  }
  if ($('preview').open) {
    const activePage = project().pages.find(item => item.id === state.previewPage);
    if (activePage) refreshBoard($('previewBoard'),activePage,true);
    $('previewSim').innerHTML = `${icon(state.running ? 'stop' : 'bolt')} ${state.running ? 'Stop simulation' : 'Start simulation'}`;
  }
}

function flipSimulation() {
  state.running = !state.running;
  addLog(state.running ? 'Virtual PLC simulation started.' : 'Virtual PLC simulation paused.');
  renderSimulationStatus();
  if (state.running) simulationStep();
  refreshRuntime(true);
}

function profile(target) {
  return {Windows:{format:'MSI',viewport:860},Linux:{format:'AppImage',viewport:800},Android:{format:'APK',viewport:620}}[target];
}

function previewSize() {
  if (!$('preview').open) return;
  const host = $('previewHost');
  const max = Math.min(profile(state.previewTarget).viewport, $('preview').clientWidth-24, Math.max(160,(innerHeight-200)*width/height));
  const scale = Math.min(max/width,1);
  Object.assign(host.style,{width:`${width*scale}px`,height:`${height*scale}px`});
  $('previewBoard').style.transform = `scale(${scale})`;
}

function renderPreview() {
  const activePage = project().pages.find(item => item.id === state.previewPage) || page();
  drawBoard($('previewBoard'),activePage,true);
  $('previewSim').innerHTML = `${icon(state.running ? 'stop' : 'bolt')} ${state.running ? 'Stop simulation' : 'Start simulation'}`;
  previewSize();
}

function openPreview() {
  state.previewPage = page().id;
  const dialog = $('preview');
  dialog.innerHTML = `<div class="dialog-head"><h2 id="previewTitle">Runtime preview</h2><span class="chip">BROWSER</span>${button('close-preview','close','Close runtime preview')}</div>
    <div class="preview-toolbar"><select data-field="preview-page" aria-label="Runtime screen">${project().pages.map(item => `<option value="${item.id}" ${item.id === state.previewPage ? 'selected' : ''}>${escape(item.name)}</option>`).join('')}</select>
    <select data-field="preview-target" aria-label="Runtime target">${targets.map(target => `<option ${target === state.previewTarget ? 'selected' : ''}>${target}</option>`).join('')}</select>
    <span class="spacer"></span><button class="action" id="previewSim" data-action="simulate"></button></div>
    <div class="preview-body"><div id="previewHost" class="preview-host"><div id="previewBoard" class="artboard previewing"></div></div>
    <p class="preview-note">Target profiles change the preview size. Pump, valve, and command controls write to the virtual PLC.</p></div>`;
  dialog.showModal();
  renderPreview();
}

function activatePreviewWidget(node) {
  const p = project().pages.find(item => item.id === state.previewPage);
  const widget = p?.widgets.find(item => item.id === node.dataset.widget);
  if (!widget || !['pump','valve','button'].includes(widget.kind)) return;
  const record = getTag(widget.tag);
  if (record?.type === 'BOOL' && record.writable) writeTag(record.id,!tagValue(record.id));
  else toast('Bind this control to a writable BOOL tag.');
}

function validation() {
  const issues = project().pages.flatMap(item => item.widgets.flatMap(widget => {
    const issue = bindingIssue(widget);
    return issue ? [{page:item.name,widget:widget.name,issue}] : [];
  }));
  return issues;
}

function openPublish() {
  state.publish = {stage:1,mode:'project',targets:new Set(['Windows']),name:slug(project().name)};
  renderPublish();
}

function renderPublish() {
  const draft = state.publish;
  const steps = `<div class="stepper">${['Configure','Validate','Download'].map((name,index) =>
    `<span class="${draft.stage === index+1 ? 'current' : ''}">${index+1} ${name}</span>`).join('')}</div>`;
  let body, actions;
  if (draft.stage === 1) {
    const choice = (mode,title,description) => `<label class="choice"><input type="radio" name="publish-mode" data-field="publish-mode" value="${mode}" ${draft.mode === mode ? 'checked' : ''}><span><strong>${title}</strong><small>${description}</small></span></label>`;
    body = `<fieldset><legend>Publishing mode</legend>
      ${choice('project','Project-only bundle','Download the project and a runtime-target manifest as JSON.')}
      ${choice('installer','Standalone installer','Create a native build specification for the selected targets.')}</fieldset>
      <fieldset><legend>Runtime targets</legend>${targets.map(target => `<label class="choice"><input type="checkbox" data-field="publish-target" value="${target}" ${draft.targets.has(target) ? 'checked' : ''}> ${target} <small class="mono muted">${draft.mode === 'installer' ? profile(target).format : ''}</small></label>`).join('')}</fieldset>
      <label class="field">Artifact name<input id="artifactName" data-field="publish-name" value="${escape(draft.name)}" maxlength="70"></label>
      <div class="notice" id="publishError" hidden></div>`;
    actions = cancelButton() + primary('publish-next','check','Validate project');
  } else if (draft.stage === 2) {
    const issues = validation();
    body = `<ul class="validation-list"><li><span class="accent">${icon('check')}</span> ${project().pages.length} screens · ${project().tags.length} PLC tags</li>
      <li><span class="accent">${icon('check')}</span> Runtime targets · ${[...draft.targets].join(', ')}</li>
      ${issues.length ? issues.map(item => `<li><span class="red">${icon('warning')}</span><span>${escape(item.page)} / ${escape(item.widget)} · ${escape(item.issue)}</span></li>`).join('')
      : `<li><span class="accent">${icon('check')}</span> Component bindings validated</li>`}</ul>
      <div class="notice${issues.length ? ' error' : ''}">${issues.length ? 'Fix the listed bindings in the Inspector before exporting.' : draft.mode === 'installer'
        ? 'Native packaging is represented by a JSON build specification. Compiling or signing an installer requires the native build pipeline.'
        : 'The bundle uses the virtual PLC profile. The prototype can reopen this JSON bundle.'}</div>`;
    actions = button('publish-back',null,'Back','action') +
      (issues.length ? button('close-modal',null,'Return to editor','action') : primary('publish-download','download',draft.mode === 'installer' ? 'Download build spec' : 'Download project bundle'));
  } else {
    body = `<p><strong>Download started</strong></p><p class="mono">${escape(draft.filename)}</p>
      <p class="muted">${draft.mode === 'installer' ? 'Build specification for the selected native targets.' : 'Project data and target manifest. Open the bundle using File → Open project JSON.'}</p>`;
    actions = button('publish',null,'New export','action') + primary('close-modal','check','Done');
  }
  showModal('Publish project',steps+body,actions,'publish');
}

function publishNext() {
  const draft = state.publish;
  if (!draft.targets.size || !draft.name.trim()) {
    const error = $('publishError');
    error.hidden = false;
    error.classList.add('error');
    error.textContent = !draft.targets.size ? 'Select at least one runtime target.' : 'Enter an artifact name.';
    return;
  }
  draft.stage = 2;
  renderPublish();
}

function publishDownload() {
  const draft = state.publish;
  if (validation().length) return renderPublish();
  const installer = draft.mode === 'installer';
  const manifest = {
    schema:'hmi-forge.publish-prototype/1',
    name:draft.name.trim(),
    kind:installer ? 'native-installer-build-spec' : 'project-only-bundle',
    editor:'Compose Multiplatform design prototype',
    connection:'virtual-plc',
    targets:[...draft.targets].map(target => ({platform:target,...(installer ? {packageFormat:profile(target).format} : {})})),
    project:project()
  };
  if (installer) manifest.buildStatus = 'specification-only';
  draft.filename = `${slug(draft.name)}.${installer ? 'installer-spec' : 'hmi-project'}.json`;
  downloadJson(draft.filename,manifest);
  addLog(`Exported ${draft.filename}.`);
  if (state.output === 'log') renderOutputData();
  draft.stage = 3;
  renderPublish();
}

function menuContents(items) {
  return items.map(item => {
    if (!item) return '<hr role="separator">';
    const [label,command,key] = item;
    if (Array.isArray(command)) {
      return `<div class="menuitem"><button role="menuitem" tabindex="-1" data-submenu aria-haspopup="menu" aria-expanded="false">${label}<span class="spacer"></span>${icon('chevron')}</button><div class="menu" role="menu" hidden>${menuContents(command)}</div></div>`;
    }
    return `<div class="menuitem"><button role="menuitem" tabindex="-1" data-action="${command}">${label}${key ? `<span class="shortcut">${key}</span>` : ''}</button></div>`;
  }).join('');
}

function setupMenus() {
  $('menubar').insertAdjacentHTML('afterbegin',Object.keys(menus).map(name =>
    `<button class="textbtn" data-menu="${name}" aria-haspopup="menu" aria-expanded="false">${name}</button>`).join(''));
  $('menubar').insertAdjacentHTML('beforeend','<div id="menuPanel" class="menu" role="menu" hidden></div>');
}

function menuButtons(menu) {
  return [...menu.querySelectorAll(':scope > .menuitem > button')];
}

function closeMenu(returnFocus = false) {
  if (!state.menu) return;
  const trigger = state.menu.trigger;
  trigger.setAttribute('aria-expanded','false');
  trigger.classList.remove('on');
  $('menuPanel').hidden = true;
  state.menu = null;
  if (returnFocus) trigger.focus();
}

function showMenu(name,trigger,keyboard = false) {
  if (state.menu?.trigger === trigger) return closeMenu(true);
  closeMenu();
  const panel = $('menuPanel');
  panel.innerHTML = menuContents(menus[name]);
  panel.hidden = false;
  panel.setAttribute('aria-label',`${name} menu`);
  const anchor = trigger.getBoundingClientRect();
  const base = $('menubar').getBoundingClientRect();
  panel.style.left = `${Math.max(3,Math.min(anchor.left,innerWidth-panel.offsetWidth-4)-base.left)}px`;
  panel.style.top = `${anchor.bottom-base.top+3}px`;
  trigger.setAttribute('aria-expanded','true');
  trigger.classList.add('on');
  state.menu = {trigger,name};
  if (keyboard) menuButtons(panel)[0]?.focus();
}

function openSubmenu(trigger,focus = false,toggle = false) {
  const group = trigger.parentElement;
  const menu = group.parentElement;
  const sub = trigger.nextElementSibling;
  if (toggle && !sub.hidden) {
    sub.hidden = true;
    trigger.setAttribute('aria-expanded','false');
    return;
  }
  for (const other of menuButtons(menu)) {
    if (!other.hasAttribute('data-submenu')) continue;
    other.setAttribute('aria-expanded',other === trigger);
    other.nextElementSibling.hidden = other !== trigger;
  }
  if (innerWidth > 660) {
    sub.style.left = '';
    sub.style.right = '';
    if (sub.getBoundingClientRect().right > innerWidth - 4) {
      sub.style.left = 'auto';
      sub.style.right = 'calc(100% - 2px)';
    }
  }
  if (focus) menuButtons(sub)[0]?.focus();
}

const commands = [...new Map(Object.values(menus).flatMap(items => {
  const flatten = entries => entries.flatMap(item => !item ? [] : Array.isArray(item[1]) ? flatten(item[1]) : [item]);
  return flatten(items);
}).map(item => [item[1],item])).values()];

function commandResults(query = '') {
  const search = query.toLowerCase().trim();
  return commands.filter(([label]) => label.toLowerCase().includes(search)).map(([label,action,key]) =>
    `<button data-command="${action}"><span>${label}</span>${key ? `<kbd>${key}</kbd>` : ''}</button>`).join('') || '<span class="muted">No matching actions.</span>';
}

function showAbout(quick = false) {

    showModal('Quick start','<ol class="validation-list"><li>1. Select a component in Process Overview and drag it or edit its transform in the Inspector.</li><li>2. Open Bindings and choose a typed PLC tag. Use Engineering Search to jump to references.</li><li>3. Run the simulation, open Preview, and toggle the intake pump. Inspect the downstream tag changes.</li><li>4. Write 5 bar to PT101_PRESS in Tag Monitor. Open Alarms and acknowledge the resulting critical alarm.</li><li>5. Use Publish to validate and download a project bundle or native installer build specification.</li></ol>');

  }

}

function runAction(action) {
  const [command,arg,extra] = action.split(':');
  switch (command) {
    case 'save': return save();
    case 'open-file': case 'reset-project': return requestProjectChange(command);
    case 'confirm-open-file': $('modal').close(); return $('importFile').click();
    case 'confirm-reset-project': $('modal').close(); return changeProject(structuredClone(sample),'Demo project');
    case 'export-json': downloadJson(`${slug(project().name)}.hmi.json`,project()); return toast('Project JSON download started.');
    case 'new-page': return openNewPage();
    case 'create-page': return createPage();
    case 'undo': return restoreHistory('undo','redo');
    case 'redo': return restoreHistory('redo','undo');
    case 'page': return setPage(arg);
    case 'close-page': {
      if (state.openTabs.length === 1) return toast('Keep one screen open.');
      const index = state.openTabs.indexOf(arg);
      state.openTabs.splice(index,1);
      return arg === state.pageId ? setPage(state.openTabs[Math.max(0,index-1)]) : renderTabs();
    }
    case 'tree': state.treeOpen = !state.treeOpen; return renderLeft();
    case 'widget': return selectWidget(arg);
    case 'reference':
      state.selection = extra; setPage(arg,true); return openInspector('bindings');
    case 'visibility': {
      const widget = page().widgets.find(item => item.id === arg);
      if (widget) transact(() => { widget.visible = !widget.visible; });
      return;
    }
    case 'copy':
      if (!selected()) return toast('Select a component first.');
      state.clipboard = structuredClone(selected());
      return toast(`Copied ${selected().name}.`);
    case 'paste': return pasteWidget();
    case 'duplicate':
      if (!selected()) return toast('Select a component first.');
      return pasteWidget(selected());
    case 'delete': return removeWidget();
    case 'show-project': case 'show-palette':
      state.left = command.slice(5);
      state.leftOpen = true;
      state.mobileLeft = true;
      state.mobileRight = false;
      state.paletteFilter = '';
      renderDocks();
      return renderLeft();
    case 'toggle-left':
      if (mobile()) { state.mobileLeft = !state.mobileLeft; state.mobileRight = false; }
      else state.leftOpen = !state.leftOpen;
      return renderDocks();
    case 'toggle-right':
      if (mobile()) { state.mobileRight = !state.mobileRight; state.mobileLeft = false; }
      else state.rightOpen = !state.rightOpen;
      return renderDocks();
    case 'toggle-output': state.outputOpen = !state.outputOpen; return renderDocks();
    case 'restore-docks':
      state.leftOpen = state.rightOpen = state.outputOpen = true;
      state.mobileLeft = state.mobileRight = false;
      $('studio').style.removeProperty('--output-height');
      return renderDocks();
    case 'grid': state.grid = !state.grid; return renderChrome();
    case 'snap': state.snap = !state.snap; return renderChrome();
    case 'select-tool': case 'pan-tool': state.tool = command.split('-')[0]; return renderChrome();
    case 'zoom-in': case 'zoom-out':
      state.zoom = clamp(Math.round((canvasScale+(command === 'zoom-in' ? .1 : -.1))*100)/100,.10,2);
      return fitCanvas();
    case 'fit': state.zoom = null; state.panX = state.panY = 0; return fitCanvas();
    case 'inspect-properties': case 'inspect-bindings': case 'inspect-events': return openInspector(command.slice(8));
    case 'out-tags': case 'out-search': case 'out-alarms': case 'out-log': return setOutput(command.slice(4));
    case 'search-tag': state.searchScope = 'All items'; return setOutput('search',arg);
    case 'tag-ref': return setOutput('tags',arg);
    case 'alarm-ref': state.alarmFilter = 'all'; return setOutput('alarms');
    case 'find-binding':
      state.searchScope = 'All items';
      return setOutput('search',selected()?.tag);
    case 'simulate': return flipSimulation();
    case 'reset-simulation': resetRuntime(); addLog('Virtual PLC values reset.'); refreshRuntime(true); return toast('Simulated values reset.');
    case 'write': return openTagWriter(arg);
    case 'apply-tag': return applyWrite(arg);
    case 'clear-log': state.log = []; return renderOutputData();
    case 'alarm-test': {
      const critical = project().alarms.find(item => item.priority === 'Critical' && getTag(item.tag)?.writable);
      if (!critical) return toast('This project has no writable critical alarm tag.');
      const delta = critical.comparison === 'above' ? .6 : -.6;
      writeTag(critical.tag,Math.round((critical.limit+delta)*10)/10);
      state.alarmFilter = 'active';
      setOutput('alarms');
      return toast(`Injected ${critical.id}.`);
    }
    case 'ack': {
      const active = state.activeAlarms.get(arg);
      if (!active || active.ack) return;
      active.ack = true;
      addLog(`${arg} acknowledged.`);
      refreshRuntime(true);
      return toast(`${arg} acknowledged.`);
    }
    case 'preview': return openPreview();
    case 'close-preview': return $('preview').close();
    case 'publish': return openPublish();
    case 'publish-back': state.publish.stage = 1; return renderPublish();
    case 'publish-next': return publishNext();
    case 'publish-download': return publishDownload();
    case 'commands': return showCommands();
    case 'about': return showAbout();
    case 'quick-start': return showAbout(true);
    case 'close-modal': return $('modal').close();
    case 'validate': {
      const issues = validation();
      return showModal('Binding validation',issues.length
        ? `<ul class="validation-list">${issues.map(item => `<li class="amber">${escape(item.page)} / ${escape(item.widget)} · ${escape(item.issue)}</li>`).join('')}</ul>`
        : '<p class="accent">All component bindings passed validation.</p>');
    }
    default:
      if (command.startsWith('add-') && Object.hasOwn(kinds,command.slice(4))) return insertWidget(command.slice(4));
  }
}

document.addEventListener('click',event => {
  const trigger = event.target.closest('button');
  if (!trigger) {
    closeMenu();
    const widget = event.target.closest('#previewBoard .widget');
    if (widget) activatePreviewWidget(widget);
    return;
  }
  if (trigger.dataset.menu) return showMenu(trigger.dataset.menu,trigger,event.detail === 0);
  if (trigger.dataset.action === 'insert-menu') return showMenu('Insert',trigger,event.detail === 0);
  if (trigger.hasAttribute('data-submenu')) return openSubmenu(trigger,event.detail === 0,true);
  if (trigger.dataset.command) {
    $('modal').close();
    return runAction(trigger.dataset.command);
  }
  if (trigger.dataset.action) {
    closeMenu();
    return runAction(trigger.dataset.action);
  }
});

function handleMenuKey(event) {
  const control = event.target.closest('[role=menuitem]');
  if (!control) return;
  const menu = control.closest('[role=menu]');
  const controls = menuButtons(menu);
  const index = controls.indexOf(control);
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    controls[(index+(event.key === 'ArrowDown' ? 1 : controls.length-1))%controls.length].focus();
  } else if (event.key === 'ArrowRight' && control.hasAttribute('data-submenu')) {
    event.preventDefault();
    openSubmenu(control,true);
  } else if (event.key === 'ArrowLeft' && menu.id !== 'menuPanel') {
    event.preventDefault();
    menu.hidden = true;
    menu.previousElementSibling.setAttribute('aria-expanded','false');
    menu.previousElementSibling.focus();
  }
}

document.addEventListener('input',event => {
  const {field} = event.target.dataset;
  switch (field) {
    case 'palette-filter':
      state.paletteFilter = event.target.value;
      return setHtml('paletteGrid',paletteItems() || '<span class="muted">No matches</span>');
    case 'output-filter':
      state.filter = event.target.value;
      return renderOutputData();
    case 'command-search': return setHtml('commandResults',commandResults(event.target.value));
    case 'publish-name': state.publish.name = event.target.value; break;
  }
});

document.addEventListener('change',event => {
  const element = event.target;
  const {field} = element.dataset;
  if (!field) return;
  if (field.startsWith('widget-')) return setWidgetField(field.slice(7),element);
  switch (field) {
    case 'page-name': {
      const name = element.value.trim();
      if (name && name !== page().name) transact(() => { page().name = name; });
      else element.value = page().name;
      break;
    }
    case 'alarm-filter':
      state.alarmFilter = element.value; return renderOutputData();
    case 'search-scope':
      state.searchScope = element.value; return renderOutputData();
    case 'preview-page':
      state.previewPage = element.value; return renderPreview();
    case 'preview-target':
      state.previewTarget = element.value; return previewSize();
    case 'publish-mode':
      state.publish.mode = element.value;
      renderPublish();
      $('modal').querySelector('input[data-field=publish-mode]:checked')?.focus();
      break;
    case 'publish-target':
      if (element.checked) state.publish.targets.add(element.value);
      else state.publish.targets.delete(element.value);
      break;
  }
});

$('importFile').addEventListener('change',async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const replacement = data?.schema === 'hmi-forge.publish-prototype/1' ? data.project : data;
    if (!isProject(replacement)) throw Error('Invalid project');
    changeProject(replacement,'Opened from file');
    toast(`Opened ${replacement.name}.`);
  } catch {
    toast('This file is not a valid HMI Forge prototype project.');
  }
});

document.addEventListener('submit',event => {
  event.preventDefault();
  if (event.target.id === 'pageForm') createPage();
  if (event.target.id === 'writeForm') $('modal').querySelector('[data-action^=apply-tag]')?.click();
});

const shortcuts = {
  s:'save',k:'commands',f:'out-search',z:'undo',y:'redo',c:'copy',v:'paste',d:'duplicate'
};
document.addEventListener('keydown',event => {
  const key = event.key;
  if (state.menu && key === 'Escape') {
    event.preventDefault(); return closeMenu(true);
  }
  if (state.menu && key === 'Tab') closeMenu();
  if (event.target.closest('#previewBoard .widget') && ['Enter',' '].includes(key)) {
    event.preventDefault();
    return activatePreviewWidget(event.target.closest('.widget'));
  }
  if ($('modal').open || $('preview').open) {
    if (event.target.id === 'commandInput' && key === 'Enter') $('commandResults').querySelector('button')?.click();
    return;
  }
  const editing = event.target.matches('input,textarea,select,[contenteditable=true]');
  if (editing) {
    if (key === 'Enter' && event.target.closest('#inspectorBody')) event.target.blur();
    return;
  }
  if ((event.ctrlKey || event.metaKey) && Object.hasOwn(shortcuts,key.toLowerCase())) {
    const action = event.shiftKey && key.toLowerCase() === 'z' ? 'redo' : shortcuts[key.toLowerCase()];
    event.preventDefault();
    runAction(action);
    if (action === 'out-search') $('outputFilter')?.focus();
    return;
  }
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const direct = {F5:'preview',F6:'simulate',Delete:'delete',v:'select-tool',h:'pan-tool'};
  if (Object.hasOwn(direct,key)) {
    event.preventDefault();
    runAction(direct[key]);
  }
});

const field = $('canvasField');
let drag;
field.addEventListener('pointerdown',event => {
  if (event.button !== 0 || event.target.closest('button')) return;
  closeMenu();
  const node = event.target.closest('.widget');
  if (state.tool === 'pan') {
    drag = {id:event.pointerId,startX:event.clientX,startY:event.clientY,panX:state.panX,panY:state.panY};
    field.classList.add('panning');
  } else if (node) {
    const widget = page().widgets.find(item => item.id === node.dataset.widget);
    const resizing = event.target.hasAttribute('data-resize');
    selectWidget(widget.id);
    if (widget.locked) return;
    drag = {id:event.pointerId,startX:event.clientX,startY:event.clientY,widget,node,resizing,x:widget.x,y:widget.y,w:widget.w,h:widget.h,moved:false};
  } else {
    selectWidget(null);
    return;
  }
  field.setPointerCapture(event.pointerId);
  event.preventDefault();
});
field.addEventListener('pointermove',event => {
  if (!drag || drag.id !== event.pointerId) return;
  const dx = event.clientX-drag.startX, dy = event.clientY-drag.startY;
  if (!drag.widget) {
    state.panX = drag.panX + dx;
    state.panY = drag.panY + dy;
    fitCanvas();
    return;
  }
  if (!drag.moved && Math.hypot(dx,dy) < 3) return;
  const adjust = number => state.snap ? Math.round(number/8)*8 : Math.round(number);
  const widget = drag.widget;
  if (!drag.moved) {
    pushHistory();
    drag.moved = true;
  }
  if (drag.resizing) {
    widget.w = clamp(adjust(drag.w+dx/canvasScale),16,width-widget.x);
    widget.h = clamp(adjust(drag.h+dy/canvasScale),16,height-widget.y);
    drag.node.style.width = `${widget.w}px`;
    drag.node.style.height = `${widget.h}px`;
  } else {
    widget.x = clamp(adjust(drag.x+dx/canvasScale),0,width-widget.w);
    widget.y = clamp(adjust(drag.y+dy/canvasScale),0,height-widget.h);
    drag.node.style.left = `${widget.x}px`;
    drag.node.style.top = `${widget.y}px`;
  }
});
function endDrag(event) {
  if (!drag || drag.id !== event.pointerId) return;
  field.classList.remove('panning');
  if (drag.moved) { renderInspector(); renderChrome(); }
  drag = null;
}
field.addEventListener('pointerup',endDrag);
field.addEventListener('pointercancel',endDrag);

const grip = $('outputGrip');
function resizeOutput(size) {
  const minimum = 105;
  const maximum = Math.max(minimum,Math.min(420,innerHeight-360));
  const height = clamp(size,minimum,maximum);
  $('studio').style.setProperty('--output-height',`${height}px`);
  grip.setAttribute('aria-valuemin',minimum);
  grip.setAttribute('aria-valuemax',maximum);
  grip.setAttribute('aria-valuenow',Math.round(height));
}
let dockDrag;
grip.addEventListener('pointerdown',event => {
  if (event.button !== 0) return;
  event.preventDefault();
  grip.focus();
  dockDrag = {id:event.pointerId,y:event.clientY,height:$('output').offsetHeight};
  grip.setPointerCapture(event.pointerId);
});
document.addEventListener('pointermove',event => {
  if (dockDrag?.id === event.pointerId) resizeOutput(dockDrag.height+dockDrag.y-event.clientY);
});
function endDockResize(event) {
  if (dockDrag?.id === event.pointerId) dockDrag = null;
}
document.addEventListener('pointerup',endDockResize);
document.addEventListener('pointercancel',endDockResize);
grip.addEventListener('keydown',event => {
  if (!['ArrowUp','ArrowDown'].includes(event.key)) return;
  event.preventDefault();
  resizeOutput($('output').offsetHeight + (event.key === 'ArrowUp' ? 20 : -20));
});

function mount() {
  document.querySelectorAll('[data-icon]').forEach(node => { node.innerHTML = icon(node.dataset.icon); });
  setupMenus();
  $('menuPanel').addEventListener('keydown',handleMenuKey);
  resetRuntime();
  addLog('Virtual PLC profile initialized.');
  addLog('HMI Forge browser prototype ready.');
  renderAll();
  new ResizeObserver(fitCanvas).observe(field);
  new ResizeObserver(() => {
    if (!state.outputOpen) return;
    grip.setAttribute('aria-valuemin','105');
    grip.setAttribute('aria-valuemax',Math.max(105,Math.min(420,innerHeight-360)));
    grip.setAttribute('aria-valuenow',$('output').offsetHeight);
  }).observe($('output'));
  matchMedia('(max-width:1060px)').addEventListener('change',renderDocks);
  window.addEventListener('resize',previewSize);
  setInterval(simulationStep,850);
}
mount();
</script>
</body>
</html>
