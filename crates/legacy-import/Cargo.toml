[package]
name = "hmi-legacy-import"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hmi-project-model = { path = "../project-model" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10.9"
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
png = "=0.18.1"
jpeg-decoder = { version = "=0.3.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
