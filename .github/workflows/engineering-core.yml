name: Engineering core CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engineering-core-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: crates/engineering-core
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/engineering-core
          save-if: 'false'
          cache-bin: 'false'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked
