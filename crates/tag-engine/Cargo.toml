[package]
name = "hmi-tag-engine"
version = "0.1.0"
edition = "2021"
description = "Framework-independent HMI Studio tag engine: typed tag values, quality, subscriptions, driver abstraction, scan groups, simulated PLC and binding evaluation."
repository = "https://github.com/kandyman991/HMIStudio"
publish = false
# No `license` field on purpose: the project owner has not selected a license yet.

# Standalone workspace root, same policy as the other crates.
[workspace]

[dependencies]
hmi-project-model = { path = "../project-model" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
